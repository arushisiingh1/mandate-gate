[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandate-gate"
version = "0.1.0"
description = "A deterministic authorization layer for AI shopping agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
# Risk model training, evaluation, the demo's model, and the notebook.
# (The gate itself, the tests and the rules-only demo need only `cryptography`.)
ml = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.8"]
# Optional Claude-backed shopping agent.
agent = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
mandate-gate = "mandate_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
